    # Nombre de la aplicación
    spring.application.name=backend

    # Configuración de la base de datos MySQL
    spring.datasource.url=jdbc:mysql://localhost:3306/utp_lite_db
    spring.datasource.username=root
    spring.datasource.password=

    # Configuración de JPA/Hibernate
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
    spring.jpa.show-sql=true
    spring.jpa.properties.hibernate.format_sql=true

    # Configuración del pool de conexiones
    spring.datasource.hikari.connection-timeout=20000
    spring.datasource.hikari.maximum-pool-size=10
    spring.datasource.hikari.minimum-idle=5
    spring.datasource.hikari.idle-timeout=300000
    spring.datasource.hikari.max-lifetime=1200000

    # Configuración de servidor
    server.port=8080
    server.error.include-message=always
    server.error.include-binding-errors=always

    # Configuración para archivos (útil si vas a manejar uploads)
    spring.servlet.multipart.max-file-size=10MB
    spring.servlet.multipart.max-request-size=10MB

    # Configuración de logging
    logging.level.org.hibernate.SQL=DEBUG
    logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
    logging.level.pe.edu.utp=DEBUG

    # Si usas scripts SQL para preparar datos
    spring.sql.init.mode=always
    spring.jpa.defer-datasource-initialization=true
    # ------------------------------------------------------------------------------------------------
    # FIREBASE CONFIGURATION
    # ------------------------------------------------------------------------------------------------

    # clave Web API para el endpoint REST
    firebase.api.key=

    # ruta relativa dentro de classpath
    firebase.config.path=src/main/resources/static/firebase-adminsdk.json

    # Configuración básica
    grpc.server.port=9090
    grpc.server.address=0.0.0.0

    # Optimización de rendimiento
    grpc.server.max-inbound-message-size=4MB
    grpc.server.max-inbound-metadata-size=8KB
    grpc.server.executor-threads=16

    # Keep-alive para reducir latencia en conexiones persistentes
    grpc.server.keepalive-time=60s
    grpc.server.keepalive-timeout=20s
    grpc.server.permit-keepalive-without-calls=true
    grpc.server.permit-keepalive-time=10s
    # Configuración específica de seguridad gRPC (opcional)
    grpc.server.security.enabled=false
    # Si quieres habilitar seguridad TLS:
    # grpc.server.security.enabled=true
    # grpc.server.security.certificateChain=file:certificates/server.crt
    # grpc.server.security.privateKey=file:certificates/server.key